site_name: Heirloom Wiki
site_description: Wiki và tài liệu hướng dẫn dành cho quản trị viên máy chủ về các hệ thống Nấu ăn, Làm vườn, Ủ rượu và Cà phê của Heirloom.
site_url: https://kernel-person.github.io/heirloom-docs/
repo_url: https://github.com/kernel-person/heirloom-docs
repo_name: kernel-person/heirloom-docs

theme:
  name: material
  language: vi
  logo: images/heirloom-logo.png
  favicon: images/heirloom-logo.png
  palette:
    - scheme: default
      primary: green
      accent: deep orange
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/navigation-scroll.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Trang chủ: index.md
  - Bắt đầu:
      - Thiết đặt: getting-started/installation.md
      - Bữa ăn đầu tiên: getting-started/first-meal.md

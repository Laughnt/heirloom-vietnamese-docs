<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Heirloom Distillery Addon Logo</title>
  <desc id="desc">Heirloom style round badge using the grape player head from the distillery item list.</desc>

  <defs>
    <radialGradient id="paper" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#f2efe4" />
      <stop offset="100%" stop-color="#dcd8c8" />
    </radialGradient>
    <path id="topArc" d="M 196 370 A 316 316 0 0 1 828 370" />
    <path id="bottomArc" d="M 230 714 A 282 282 0 0 0 794 714" />
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.18" />
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="#dcd8c8" />
  <circle cx="512" cy="512" r="452" fill="url(#paper)" />

  <circle cx="512" cy="512" r="420" fill="none" stroke="#31383a" stroke-width="14" />
  <circle cx="512" cy="512" r="386" fill="none" stroke="#647a63" stroke-width="8" />

  <path d="M 182 542 A 330 330 0 0 1 842 542 L 842 558 L 182 558 Z" fill="#667a63" />

  <g filter="url(#softShadow)">
    <rect x="326" y="354" width="372" height="372" rx="26" fill="#f0ece0" opacity="0.95" />
    <image href="https://mc-heads.net/head/d511a5ee4d17682a25f7e8a5da6ff7cd9ad9c4844c258a6de23e7f84f27f9b4/512" x="334" y="360" width="356" height="356" preserveAspectRatio="xMidYMid meet" />
  </g>

  <g font-family="Georgia, serif" font-weight="700" fill="#31383a" letter-spacing="5">
    <text font-size="104">
      <textPath href="#topArc" startOffset="50%" text-anchor="middle">HEIRLOOM</textPath>
    </text>
    <text font-size="80">
      <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">DISTILLERY</textPath>
    </text>
  </g>
</svg>
